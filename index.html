<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantauan Berat Badan われわれわ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#f1f5ee;--bg2:#e3ecdd;--card:#fbfdf9;--tx:#15251d;--mu:#5d6f64;--ac:#0e7c6b;--acx:#fff;--hi:#c8f169;--bd:#d3dfcc;--dg:#d6453d;--sh:0 12px 32px rgba(21,37,29,.09);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--bg2:#13241d;--card:#162a22;--tx:#e6f2ea;--mu:#8fa89a;--ac:#c8f169;--acx:#10200a;--hi:#2c4a1c;--bd:#27403421;--bd:#284236;--dg:#ff7a72;--sh:0 12px 32px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e1a15;--bg2:#13241d;--card:#162a22;--tx:#e6f2ea;--mu:#8fa89a;--ac:#c8f169;--acx:#10200a;--hi:#2c4a1c;--bd:#284236;--dg:#ff7a72;--sh:0 12px 32px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;background-image:radial-gradient(900px 400px at 85% -10%,var(--bg2),transparent),radial-gradient(700px 400px at -10% 30%,var(--bg2),transparent);background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.brand{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 5px var(--hi);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
.seg{position:relative;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px;box-shadow:var(--sh)}
.seg button{position:relative;z-index:1;border:0;background:none;font:inherit;font-weight:500;color:var(--mu);padding:9px 18px;border-radius:999px;cursor:pointer;transition:color .3s}
.seg button.on{color:var(--acx)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:0;background:var(--ac);border-radius:999px;transition:transform .45s cubic-bezier(.5,1.4,.5,1),width .45s cubic-bezier(.5,1.4,.5,1)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero small{color:var(--mu);font-size:.95rem}
.hero h1{margin:2px 0 0;font-size:clamp(2.2rem,7vw,3.8rem);line-height:1;letter-spacing:-.04em;font-weight:800;transition:opacity .25s,transform .25s}
.hero h1.sw{opacity:0;transform:translateY(10px)}
.wk{display:flex;gap:8px;align-items:center}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);width:44px;height:44px;border-radius:14px;font:inherit;font-size:1.2rem;cursor:pointer;transition:transform .2s,background .2s}
.ib:hover{transform:translateY(-2px);background:var(--hi)}
.ib:active{transform:scale(.92)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px 18px;box-shadow:var(--sh)}
.st b{display:block;font-size:2rem;letter-spacing:-.03em;font-weight:800}
.st span{color:var(--mu);font-size:.9rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input[type=search]{flex:1;min-width:180px}
input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--hi)}
textarea{resize:vertical;min-height:70px}
.btn{border:0;font:inherit;font-weight:600;padding:11px 18px;border-radius:14px;cursor:pointer;background:var(--ac);color:var(--acx);transition:transform .2s,filter .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:scale(.96)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--dg);color:#fff}
.tw{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-weight:600;color:var(--mu);font-size:.88rem;padding:14px 16px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--tx)}
td{padding:14px 16px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:.96rem}
tbody tr{animation:in .5s both;transition:background .2s}
tbody tr:hover{background:var(--bg2)}
tbody tr:last-child td{border-bottom:0}
@keyframes in{from{opacity:0;transform:translateX(-14px)}}
.nm{font-weight:600}
.bmi{display:inline-block;margin-top:4px;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--hi);color:var(--tx)}
.act{display:flex;gap:6px}
.sm{padding:7px 13px;font-size:.88rem;border-radius:11px}
.sync{font-size:.88rem;color:var(--mu);margin:0 0 12px}
.emp{text-align:center;padding:48px 16px;color:var(--mu)}
.emp b{display:block;color:var(--tx);font-size:1.2rem;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(10,20,15,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.md{background:var(--card);border-radius:24px;padding:24px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:var(--sh);animation:pop .4s cubic-bezier(.5,1.5,.5,1)}
@keyframes pop{from{transform:scale(.88) translateY(20px);opacity:0}}
.md h2{margin:0 0 14px;letter-spacing:-.02em}
.f{margin-bottom:12px}
.f label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:5px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.err{color:var(--dg);font-size:.88rem;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ac);color:var(--acx);padding:12px 20px;border-radius:99px;font-weight:600;transition:transform .45s cubic-bezier(.5,1.5,.5,1);z-index:60;box-shadow:var(--sh)}
.toast.show{transform:translate(-50%,0)}
.adm{display:none}.isadm .adm{display:table-cell}.isadm div.adm,.isadm span.adm{display:flex}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <div class="brand"><span class="dot"></span>Timbang</div>
  <div class="seg" id="seg"><span class="pill" id="pill"></span>
    <button class="on" data-m="user">Tampilan User</button>
    <button data-m="admin">Admin</button>
  </div>
</header>

<div class="hero">
  <div><small id="rng">–</small><h1 id="wkTitle">Minggu ini</h1></div>
  <div class="wk">
    <button class="ib" id="prev" aria-label="Minggu sebelumnya">‹</button>
    <button class="btn g" id="today">Minggu ini</button>
    <button class="ib" id="next" aria-label="Minggu berikutnya">›</button>
  </div>
</div>

<div class="stats">
  <div class="st"><b id="s1">0</b><span>Peserta minggu ini</span></div>
  <div class="st"><b id="s2">0</b><span>Rata-rata berat (kg)</span></div>
  <div class="st"><b id="s3">0</b><span>Rata-rata BMI</span></div>
</div>

<div class="sync" id="sync"></div>
<div class="bar">
  <input type="search" id="q" placeholder="Cari nama, pola makan, atau olahraga…">
  <span class="adm" id="admBar" style="gap:8px;flex-wrap:wrap">
    <button class="btn" id="add">+ Tambah data</button>
    <button class="btn g" id="copy">Salin dari minggu lalu</button>
    <button class="btn g" id="exp">Ekspor</button>
    <button class="btn g" id="imp">Impor</button>
    <button class="btn g" id="out">Keluar</button>
  </span>
</div>

<div class="tw"><table>
<thead><tr>
  <th>No</th><th data-s="nama">Nama ↕</th><th data-s="bb">Berat (kg) ↕</th><th data-s="tb">Tinggi (cm) ↕</th><th>Pola makan</th><th>Kegiatan olahraga</th><th class="adm">Aksi</th>
</tr></thead>
<tbody id="tb"></tbody></table></div>
<input type="file" id="file" accept=".json" hidden>
</div>

<div class="ov" id="ovLogin"><div class="md">
  <h2>Masuk sebagai admin</h2>
  <div class="f"><label>Username</label><input id="lu" autocomplete="username"></div>
  <div class="f"><label>Sandi</label><input id="lp" type="password" autocomplete="current-password"></div>
  <div class="err" id="le"></div>
  <div class="mb"><button class="btn g" data-close>Batal</button><button class="btn" id="lgo">Masuk</button></div>
</div></div>

<div class="ov" id="ovForm"><div class="md">
  <h2 id="fT">Tambah data</h2>
  <div class="f"><label>Nama</label><input id="fn"></div>
  <div class="r2">
    <div class="f"><label>Berat badan (kg)</label><input id="fb" type="number" step="0.1" min="1"></div>
    <div class="f"><label>Tinggi badan (cm)</label><input id="fh" type="number" step="0.1" min="1"></div>
  </div>
  <div class="f"><label>Pola makan</label><textarea id="fp"></textarea></div>
  <div class="f"><label>Kegiatan olahraga</label><textarea id="fo"></textarea></div>
  <div class="err" id="fe"></div>
  <div class="mb"><button class="btn g" data-close>Batal</button><button class="btn" id="fs">Simpan data</button></div>
</div></div>

<div class="ov" id="ovDel"><div class="md">
  <h2>Hapus data?</h2>
  <p id="dt" style="color:var(--mu)"></p>
  <div class="mb"><button class="btn g" data-close>Batal</button><button class="btn d" id="dgo">Hapus data</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
var ADMIN_USER="admin",ADMIN_PASS="admin123",KEY="timbang_v1";
var $=function(s){return document.querySelector(s)};
var all=[],cloud=null;
try{var raw=localStorage.getItem(KEY);if(raw){var o0=JSON.parse(raw);Object.keys(o0.weeks||{}).forEach(function(k){o0.weeks[k].forEach(function(r){all.push(Object.assign({week:k},r))})})}}catch(e){}
var isAdm=false;try{isAdm=sessionStorage.getItem("tb_adm")==="1"}catch(e){}
var sortK=null,sortD=1,editId=null,delId=null;

function save(){if(cloud)return;try{var w={};all.forEach(function(r){(w[r.week]=w[r.week]||[]).push(r)});localStorage.setItem(KEY,JSON.stringify({weeks:w}))}catch(e){}}
function put(o){if(cloud){var d=Object.assign({},o);delete d.id;return cloud.collection("entries").doc(o.id).set(d).catch(function(){toast("Gagal menyimpan. Akunmu perlu akses Contributor atau Editor.")})}
  var i=all.findIndex(function(r){return r.id===o.id});if(i>-1)all[i]=o;else all.push(o);save();render();return Promise.resolve()}
function del(id){if(cloud)return cloud.collection("entries").doc(id).delete().catch(function(){toast("Gagal menghapus. Akunmu perlu akses Contributor atau Editor.")});all=all.filter(function(r){return r.id!==id});save();render();return Promise.resolve()}
function syncUI(){var s=$("#sync");if(s)s.textContent=(isAdm?"Mode admin aktif. ":"")+(cloud?"Data tersinkron langsung di semua perangkat.":"Mode lokal: data hanya tersimpan di perangkat ini.")}
function mon(d){var x=new Date(d);x.setHours(12,0,0,0);var g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);return x}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var cur=mon(new Date());
function key(){return iso(cur)}
function rows(){return all.filter(function(r){return r.week===key()}).sort(function(a,b){return(a.ts||0)-(b.ts||0)})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var BL=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function fd(d){return d.getDate()+" "+BL[d.getMonth()]+" "+d.getFullYear()}
function bmi(r){var h=r.tb/100;return h>0?r.bb/(h*h):0}
function cat(b){return b<18.5?"Kurang":b<25?"Normal":b<30?"Berlebih":"Obesitas"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}


function anim(el,to,dec){var from=parseFloat(el.dataset.v)||0,t0=performance.now();el.dataset.v=to;
  (function f(t){var p=Math.min(1,(t-t0)/600),e=1-Math.pow(1-p,3);el.textContent=(from+(to-from)*e).toFixed(dec);if(p<1)requestAnimationFrame(f)})(t0)}

function render(){
  var s=cur,e=new Date(cur);e.setDate(e.getDate()+6);
  $("#rng").textContent=fd(s)+" – "+fd(e);
  var thisMon=iso(mon(new Date()));
  var diff=Math.round((cur-mon(new Date()))/6048e5);
  $("#wkTitle").textContent=diff===0?"Minggu ini":diff===-1?"Minggu lalu":diff===1?"Minggu depan":"Minggu "+fd(s).slice(0,-5);
  var all=rows(),q=$("#q").value.toLowerCase().trim();
  var list=all.filter(function(r){return !q||(r.nama+" "+r.pola+" "+r.olahraga).toLowerCase().indexOf(q)>-1});
  if(sortK)list=list.slice().sort(function(a,b){var x=a[sortK],y=b[sortK];return(typeof x==="string"?x.localeCompare(y):x-y)*sortD});
  var n=all.length,aw=n?all.reduce(function(a,r){return a+r.bb},0)/n:0,ab=n?all.reduce(function(a,r){return a+bmi(r)},0)/n:0;
  anim($("#s1"),n,0);anim($("#s2"),aw,1);anim($("#s3"),ab,1);
  var h="";
  list.forEach(function(r,i){var b=bmi(r);
    h+='<tr style="animation-delay:'+i*55+'ms"><td>'+(i+1)+'</td><td><div class="nm">'+esc(r.nama)+'</div><span class="bmi">BMI '+b.toFixed(1)+' · '+cat(b)+'</span></td><td>'+r.bb+'</td><td>'+r.tb+'</td><td>'+esc(r.pola)+'</td><td>'+esc(r.olahraga)+'</td>'+
    '<td class="adm"><div class="act"><button class="btn g sm" data-e="'+r.id+'">Ubah</button><button class="btn d sm" data-d="'+r.id+'">Hapus</button></div></td></tr>'}); 
  if(!list.length)h='<tr><td colspan="7"><div class="emp"><b>'+(q?"Tidak ada hasil":"Belum ada data minggu ini")+'</b>'+(q?"Coba kata kunci lain.":(isAdm?"Klik “Tambah data” untuk mulai mengisi.":"Admin belum menambahkan data untuk minggu ini."))+'</div></td></tr>';
  $("#tb").innerHTML=h;
  document.getElementById("app").classList.toggle("isadm",isAdm);
  setMode(isAdm?"admin":"user");
}
function setMode(m){syncUI();var bs=document.querySelectorAll("#seg button");
  bs.forEach(function(b){var on=b.dataset.m===m;b.classList.toggle("on",on);if(on){var p=$("#pill");p.style.width=b.offsetWidth+"px";p.style.transform="translateX("+(b.offsetLeft-4)+"px)"}})}
function toast(t){var x=$("#toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){x.classList.remove("show")},2200)}
function show(id){$(id).classList.add("show")}
function hide(){document.querySelectorAll(".ov").forEach(function(o){o.classList.remove("show")})}
function week(d){var t=$("#wkTitle");t.classList.add("sw");setTimeout(function(){cur=d;render();t.classList.remove("sw")},220)}

document.querySelectorAll("#seg button").forEach(function(b){b.onclick=function(){
  if(b.dataset.m==="user"){isAdm=false;try{sessionStorage.removeItem("tb_adm")}catch(e){}render()}
  else if(isAdm){render()} else{$("#le").textContent="";$("#lu").value="";$("#lp").value="";show("#ovLogin");setTimeout(function(){$("#lu").focus()},100)}}});
$("#lgo").onclick=function(){
  if($("#lu").value.trim()===ADMIN_USER&&$("#lp").value===ADMIN_PASS){isAdm=true;try{sessionStorage.setItem("tb_adm","1")}catch(e){}hide();render();toast("Berhasil masuk sebagai admin")}
  else $("#le").textContent="Username atau sandi salah. Coba lagi."};
$("#lp").onkeydown=function(e){if(e.key==="Enter")$("#lgo").click()};
$("#out").onclick=function(){isAdm=false;try{sessionStorage.removeItem("tb_adm")}catch(e){}render();toast("Kamu sudah keluar")};
document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=hide});
document.querySelectorAll(".ov").forEach(function(o){o.onclick=function(e){if(e.target===o)hide()}});
$("#prev").onclick=function(){var d=new Date(cur);d.setDate(d.getDate()-7);week(d)};
$("#next").onclick=function(){var d=new Date(cur);d.setDate(d.getDate()+7);week(d)};
$("#today").onclick=function(){week(mon(new Date()))};
$("#q").oninput=render;
document.querySelectorAll("th[data-s]").forEach(function(t){t.onclick=function(){var k=t.dataset.s;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=1}render()}});

function openForm(r){editId=r?r.id:null;$("#fT").textContent=r?"Ubah data":"Tambah data";
  $("#fn").value=r?r.nama:"";$("#fb").value=r?r.bb:"";$("#fh").value=r?r.tb:"";$("#fp").value=r?r.pola:"";$("#fo").value=r?r.olahraga:"";$("#fe").textContent="";show("#ovForm");setTimeout(function(){$("#fn").focus()},100)}
$("#add").onclick=function(){openForm(null)};
$("#fs").onclick=function(){var n=$("#fn").value.trim(),b=parseFloat($("#fb").value),h=parseFloat($("#fh").value);
  if(!n||!(b>0)||!(h>0)){$("#fe").textContent="Isi nama, berat, dan tinggi badan dengan angka yang valid.";return}
  var o={nama:n,bb:b,tb:h,pola:$("#fp").value.trim(),olahraga:$("#fo").value.trim()};
  var ed=editId,done=function(){hide();toast(ed?"Data diperbarui":"Data ditambahkan")};
  if(editId){var r=all.find(function(x){return x.id===editId});put(Object.assign({},r,o)).then(done)}
  else{o.id=uid();o.week=key();o.ts=Date.now();put(o).then(done)}
  };
$("#tb").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)openForm(rows().find(function(x){return x.id===b.dataset.e}));
  if(b.dataset.d){delId=b.dataset.d;var r=rows().find(function(x){return x.id===delId});$("#dt").textContent="Data “"+r.nama+"” akan dihapus dari minggu ini.";show("#ovDel")}};
$("#dgo").onclick=function(){del(delId).then(function(){hide();toast("Data dihapus")})};
$("#copy").onclick=function(){var p=new Date(cur);p.setDate(p.getDate()-7);var src=all.filter(function(r){return r.week===iso(p)});
  if(!src.length){toast("Minggu lalu belum ada data");return}
  Promise.all(src.map(function(r){return put(Object.assign({},r,{id:uid(),week:key(),ts:Date.now()}))})).then(function(){toast(src.length+" data disalin")})};
$("#exp").onclick=function(){var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify({entries:all}));a.download="timbang-backup.json";a.click()};
$("#imp").onclick=function(){$("#file").click()};
$("#file").onchange=function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(d&&d.entries){Promise.all(d.entries.map(function(r){return put(Object.assign({},r,{id:uid()}))})).then(function(){toast("Data berhasil diimpor")})}else toast("Berkas tidak valid")}catch(x){toast("Berkas tidak valid")}};rd.readAsText(f);e.target.value=""};
document.onkeydown=function(e){if(e.key==="Escape")hide()};
window.onresize=function(){setMode(isAdm?"admin":"user")};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){setMode(isAdm?"admin":"user")});
render();
(async function(){try{if(typeof claude!=="undefined")cloud=await claude.use("db")}catch(e){cloud=null}
  if(cloud){cloud.collection("entries").onSnapshot(function(s){all=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},function(){cloud=null;all=[];render()})}
  render()})();
</script>
</body>
</html>
